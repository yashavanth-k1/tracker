<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creator Tracker - Pro Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000; --card-bg: #1c1c1e; --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #F5F5F7; --text-muted: #86868B; --accent: #0A84FF; --accent-hover: #0071E3;
      --success: #32D74B; --danger: #FF453A; --warning: #FF9F0A; --glass-blur: blur(40px);
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: radial-gradient(circle at 10% 0%, #1c1c1e 0%, #000000 40%, #000000 100%); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1100px; padding: 30px 20px; animation: fadeUp 0.6s ease-out; }
    .glass-panel { background: rgba(28, 28, 30, 0.7); backdrop-filter: var(--glass-blur); border: 1px solid var(--card-border); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.5px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; }
    input, select { width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: white; font-size: 15px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    select option { background: #1c1c1e; }
    button { background: var(--accent); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: rgba(255,255,255,0.1); }
    button.danger { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .widgets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .widget { padding: 24px; display: flex; flex-direction: column; gap: 8px; }
    .widget-title { color: var(--text-muted); font-size: 14px; font-weight: 500; }
    .widget-value { font-size: 32px; font-weight: 700; }
    .toolbar-actions { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    .search-container { position: relative; flex: 1; min-width: 250px; }
    .search-input { width: 100%; padding: 16px 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; font-size: 15px; color: white;}
    .table-wrapper { overflow-x: auto; padding: 10px 0; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; padding: 16px 24px; border-bottom: 1px solid var(--card-border); }
    td { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 15px; vertical-align: top;}
    .status { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .s-completed { background: rgba(50, 215, 75, 0.15); color: var(--success); }
    .s-progress { background: rgba(10, 132, 255, 0.15); color: var(--accent); }
    .s-hold { background: rgba(255, 159, 10, 0.15); color: var(--warning); }
    .s-notstarted { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
    #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
    #modal.show { opacity: 1; pointer-events: auto; }
    .modal-content { width: 100%; max-width: 600px; padding: 32px; transform: translateY(20px); transition: 0.3s; }
    #modal.show .modal-content { transform: translateY(0); }
    .flex-row { display: flex; gap: 16px; }
    .hidden { display: none !important; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container" id="dashboardView">
  <div class="nav-bar">
    <div>
      <h1 style="display: flex; align-items: center; gap: 10px;">
        <svg width="28" height="28" fill="none" stroke="var(--accent)" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Creator Tracker
      </h1>
      <span style="color: var(--text-muted); font-size: 13px; margin-top:4px; display:block;">Offline Web Version</span>
    </div>
    <div style="display: flex; gap: 12px;">
      <button onclick="openModal()">+ New Project</button>
    </div>
  </div>

  <div class="widgets-grid">
    <div class="glass-panel widget"><span class="widget-title">TOTAL PROJECTS</span><span class="widget-value" id="wdgProjects">0</span></div>
    <div class="glass-panel widget"><span class="widget-title">TOTAL REVENUE</span><span class="widget-value" id="wdgRevenue">₹0</span></div>
    <div class="glass-panel widget"><span class="widget-title">ADVANCE COLLECTED</span><span class="widget-value" id="wdgAdvance" style="color: var(--success);">₹0</span></div>
  </div>

  <div class="toolbar-actions">
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search client name..." onkeyup="filterTable()">
    </div>
    <button onclick="exportCSV()" class="secondary">Export CSV</button>
  </div>

  <div class="glass-panel table-wrapper">
    <table id="projectsTable">
      <thead>
        <tr><th>Client</th><th>Details</th><th>Status</th><th>Total</th><th>Advance</th><th style="text-align: right;">Manage</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden">
  <div class="glass-panel modal-content">
    <h2 id="modalTitle" style="margin-bottom: 24px;">Project Details</h2>
    <input type="hidden" id="formId">
    
    <div class="flex-row">
      <div class="form-group" style="flex:1;"><label>Client Name</label><input type="text" id="formClientName" list="clientOptions"><datalist id="clientOptions"></datalist></div>
      <div class="form-group" style="flex:1;"><label>Project Name</label><input type="text" id="formProjectName"></div>
    </div>
    <div class="flex-row">
      <div class="form-group" style="flex:1;"><label>Start Date</label><input type="date" id="formStartDate"></div>
      <div class="form-group" style="flex:1;"><label>Status</label>
        <select id="formStatus">
          <option>Not Started</option><option>In Progress</option><option>On Hold</option><option>Completed</option>
        </select>
      </div>
    </div>
    <div class="flex-row">
      <div class="form-group" style="flex:1;"><label>Total Amount (₹)</label><input type="number" id="formTotalAmount"></div>
      <div class="form-group" style="flex:1;"><label>Advance (₹)</label><input type="number" id="formAdvance"></div>
    </div>
    <div class="flex-row" style="margin-top: 10px;">
      <button onclick="closeModal()" class="secondary" style="flex:1;">Cancel</button>
      <button onclick="saveProject()" id="saveBtn" style="flex:2;">Save Record</button>
    </div>
  </div>
</div>

<script>
  // Data stored in Browser LocalStorage (No Backend Required)
  let globalProjects = JSON.parse(localStorage.getItem('creatorTrackerData')) || [];

  const fmtCurrency = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

  window.onload = () => { renderTableData(); };

  function getStatusClass(status) {
    if(status === 'Completed') return 's-completed';
    if(status === 'In Progress') return 's-progress';
    if(status === 'On Hold') return 's-hold';
    return 's-notstarted';
  }

  function renderTableData(filterQuery = '') {
    const tbody = document.querySelector('#projectsTable tbody'); 
    tbody.innerHTML = '';
    
    let totCount = 0, totRev = 0, totAdv = 0;
    
    // Auto-complete clients
    const clients = [...new Set(globalProjects.map(p => p.clientName))].filter(Boolean);
    document.getElementById('clientOptions').innerHTML = clients.map(c => `<option value="${c}">`).join('');
    
    globalProjects.forEach(p => {
      const rowText = `${p.clientName} ${p.projectName} ${p.status}`.toLowerCase();
      if(filterQuery && !rowText.includes(filterQuery)) return;

      totCount++; 
      totRev += Number(p.totalAmount) || 0; 
      totAdv += Number(p.advance) || 0;

      const tr = document.createElement('tr'); 
      tr.dataset.project = JSON.stringify(p);
      
      let actHTML = `
        <td style="text-align: right; white-space: nowrap;">
          <button onclick="sendClientInvoice('${p.clientName}')" class="secondary" title="Send WhatsApp Invoice">WA</button>
          <button onclick="editProject(this)" class="secondary" style="margin-left:6px;">Edit</button>
          <button onclick="deleteProject('${p.id}')" class="danger" style="margin-left:6px;">Del</button>
        </td>`;

      tr.innerHTML = `
        <td><b>${p.clientName}</b></td>
        <td><div>${p.projectName}</div><div style="font-size:12px; color:var(--text-muted);">${p.startDate||''}</div></td>
        <td><span class="status ${getStatusClass(p.status)}">${p.status}</span></td>
        <td><b>${fmtCurrency(p.totalAmount)}</b></td>
        <td style="color:var(--success);"><b>${fmtCurrency(p.advance)}</b></td>
        ${actHTML}
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('wdgProjects').innerText = totCount; 
    document.getElementById('wdgRevenue').innerText = fmtCurrency(totRev); 
    document.getElementById('wdgAdvance').innerText = fmtCurrency(totAdv);
  }

  function filterTable() { 
    renderTableData(document.getElementById('searchInput').value.toLowerCase()); 
  }

  function sendClientInvoice(clientName) {
    const cp = globalProjects.filter(p => p.clientName === clientName); 
    if(!cp.length) return;
    
    let tAmt = 0, tAdv = 0, list = '';
    cp.forEach((p, i) => { 
      tAmt += Number(p.totalAmount)||0; 
      tAdv += Number(p.advance)||0; 
      list += `*${i+1}. ${p.projectName}*\n  Status: ${p.status}\n  Pending: ₹${Math.max((Number(p.totalAmount)||0)-(Number(p.advance)||0),0)}\n\n`; 
    });
    
    const msg = `*INVOICE & SUMMARY* 🧾\n\nHi ${clientName},\n\n*Projects:*\n${list}*Financial Summary:*\n• Total Value: ₹${tAmt}\n• Advance Paid: ₹${tAdv}\n• *Grand Pending: ₹${Math.max(tAmt-tAdv,0)}*\n\nThank you!`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
  }

  function exportCSV() {
    if(!globalProjects.length) { alert("No data to export!"); return; }
    let csv = 'Client Name,Project Name,Start Date,Status,Total Amount,Advance Received\n';
    globalProjects.forEach(p => { 
      csv += `"${p.clientName}","${p.projectName}","${p.startDate}","${p.status}","${p.totalAmount}","${p.advance}"\n`; 
    });
    const a = document.createElement('a'); 
    a.href = window.URL.createObjectURL(new Blob([csv], {type:'text/csv'})); 
    a.download = 'Website_Tracker_Backup.csv'; 
    a.click();
  }

  function openModal() { 
    ['Id','ClientName','ProjectName','StartDate','TotalAmount','Advance'].forEach(id => document.getElementById('form'+id).value=''); 
    document.getElementById('formStatus').value='Not Started'; 
    document.getElementById('modalTitle').innerText='New Project'; 
    document.getElementById('modal').classList.add('show'); 
    document.getElementById('modal').classList.remove('hidden'); 
  }
  
  function editProject(btn) { 
    const p = JSON.parse(btn.closest('tr').dataset.project); 
    document.getElementById('formId').value = p.id; 
    document.getElementById('formClientName').value = p.clientName; 
    document.getElementById('formProjectName').value = p.projectName; 
    document.getElementById('formStartDate').value = p.startDate; 
    document.getElementById('formStatus').value = p.status; 
    document.getElementById('formTotalAmount').value = p.totalAmount; 
    document.getElementById('formAdvance').value = p.advance; 
    document.getElementById('modalTitle').innerText = 'Edit Project'; 
    document.getElementById('modal').classList.add('show'); 
    document.getElementById('modal').classList.remove('hidden'); 
  }

  function closeModal() { 
    document.getElementById('modal').classList.remove('show'); 
    setTimeout(() => document.getElementById('modal').classList.add('hidden'), 300); 
  }

  function saveProject() { 
    const p = {
      id: document.getElementById('formId').value || 'PRJ-' + Date.now(),
      clientName: document.getElementById('formClientName').value,
      projectName: document.getElementById('formProjectName').value,
      startDate: document.getElementById('formStartDate').value,
      status: document.getElementById('formStatus').value,
      totalAmount: document.getElementById('formTotalAmount').value,
      advance: document.getElementById('formAdvance').value
    };

    const index = globalProjects.findIndex(x => x.id === p.id);
    if(index > -1) globalProjects[index] = p;
    else globalProjects.push(p);

    // Save to browser
    localStorage.setItem('creatorTrackerData', JSON.stringify(globalProjects));
    
    closeModal(); 
    renderTableData(); 
  }

  function deleteProject(id) { 
    if(confirm('Delete this project?')) {
      globalProjects = globalProjects.filter(x => x.id !== id);
      localStorage.setItem('creatorTrackerData', JSON.stringify(globalProjects));
      renderTableData();
    }
  }
</script>
</body>
</html>
